<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite Editor — Dark Theme</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
            surface: '#18181b',
            page: '#09090b',
            elevated: '#27272a',
            border: '#3f3f46',
            muted: '#a1a1aa',
            amber: '#fbbf24',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    * { font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11'; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #71717a; }
    .tree-item { transition: background 150ms ease-out; }
    .tree-item:hover { background: #27272a; }
    .tree-item.selected { background: #3f3f46; }
    .grid-cell { transition: background 150ms ease-out; }
    .grid-cell:hover { background: #1f1f23; }
  </style>
</head>
<body class="bg-page font-sans text-zinc-100 antialiased">
  <div class="h-screen flex flex-col">

    <!-- Top Toolbar -->
    <header class="h-12 bg-surface border-b border-border flex items-center px-4 gap-4 shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 bg-navy-500 rounded-sm"></div>
        <span class="font-semibold text-sm tracking-tight">SQLite Editor</span>
      </div>
      <div class="w-px h-6 bg-border"></div>
      <div class="flex items-center gap-1">
        <button class="px-3 py-1.5 text-sm font-medium text-zinc-300 hover:bg-elevated rounded transition-colors">Open Database</button>
        <button class="px-3 py-1.5 text-sm font-medium text-zinc-300 hover:bg-elevated rounded transition-colors">New Database</button>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 text-sm font-medium text-zinc-300 hover:bg-elevated rounded transition-colors">Import</button>
        <button class="px-3 py-1.5 bg-navy-500 text-white text-sm font-medium rounded hover:bg-navy-600 transition-colors">Download</button>
        <button class="p-2 text-zinc-400 hover:bg-elevated rounded transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-60 bg-surface border-r border-border flex flex-col shrink-0">
        <div class="p-3 border-b border-border">
          <div class="relative">
            <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" placeholder="Search tables..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-page border border-border rounded focus:outline-none focus:ring-2 focus:ring-navy-500 focus:border-transparent text-zinc-100 placeholder-zinc-500">
          </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-2">
          <div class="mb-1">
            <div class="tree-item selected flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer">
              <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
              <svg class="w-4 h-4 text-amber" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 4.02 2 6.5V17.5C2 19.98 6.48 22 12 22C17.52 22 22 19.98 22 17.5V6.5C22 4.02 17.52 2 12 2ZM12 4C16.41 4 20 5.57 20 6.5C20 7.43 16.41 9 12 9C7.59 9 4 7.43 4 6.5C4 5.57 7.59 4 12 4Z"></path>
              </svg>
              <span class="text-sm font-medium truncate">chinook</span>
            </div>

            <div class="ml-4">
              <div class="tree-item flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                <svg class="w-3 h-3 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
                <span class="text-xs font-medium text-muted uppercase tracking-wider">Tables</span>
                <span class="text-xs text-zinc-600 ml-auto">11</span>
              </div>

              <div class="ml-4 space-y-0.5">
                <div class="tree-item selected flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                  <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                  <span class="text-sm truncate">albums</span>
                </div>
                <div class="tree-item flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                  <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                  <span class="text-sm truncate">artists</span>
                </div>
                <div class="tree-item flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                  <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                  <span class="text-sm truncate">customers</span>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </aside>

      <!-- Main Area -->
      <main class="flex-1 flex flex-col overflow-hidden bg-page">
        <div class="h-12 bg-surface border-b border-border flex items-center px-4 gap-4 shrink-0">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <h1 class="font-semibold text-sm">albums</h1>
          </div>
          <div class="flex items-center gap-1 ml-4">
            <button class="px-3 py-1.5 text-sm font-medium bg-elevated border border-border rounded-t border-b-0 -mb-px relative z-10">Data</button>
            <button class="px-3 py-1.5 text-sm text-muted hover:text-zinc-100 transition-colors">Design</button>
            <button class="px-3 py-1.5 text-sm text-muted hover:text-zinc-100 transition-colors">SQL</button>
          </div>
          <div class="flex-1"></div>
        </div>

        <div class="flex-1 overflow-auto">
          <table class="w-full border-collapse">
            <thead class="sticky top-0 z-10">
              <tr class="bg-elevated border-b border-border">
                <th class="w-10 px-3 py-2 text-left">
                  <input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500 focus:ring-navy-500">
                </th>
                <th class="px-3 py-2 text-left text-xs font-semibold text-zinc-400 uppercase tracking-wider border-r border-border">
                  <div class="flex items-center gap-1">AlbumId <span class="text-zinc-600 font-normal">INTEGER</span></div>
                </th>
                <th class="px-3 py-2 text-left text-xs font-semibold text-zinc-400 uppercase tracking-wider border-r border-border">
                  <div class="flex items-center gap-1">Title <span class="text-zinc-600 font-normal">TEXT</span></div>
                </th>
                <th class="px-3 py-2 text-left text-xs font-semibold text-zinc-400 uppercase tracking-wider">
                  <div class="flex items-center gap-1">ArtistId <span class="text-zinc-600 font-normal">INTEGER</span></div>
                </th>
              </tr>
            </thead>
            <tbody class="bg-surface divide-y divide-border">
              <tr class="grid-cell">
                <td class="px-3 py-2"><input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500"></td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400 border-r border-border">1</td>
                <td class="px-3 py-2 text-sm border-r border-border">For Those About To Rock We Salute You</td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400">1</td>
              </tr>
              <tr class="grid-cell">
                <td class="px-3 py-2"><input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500"></td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400 border-r border-border">2</td>
                <td class="px-3 py-2 text-sm border-r border-border">Balls to the Wall</td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400">2</td>
              </tr>
              <tr class="grid-cell">
                <td class="px-3 py-2"><input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500"></td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400 border-r border-border">3</td>
                <td class="px-3 py-2 text-sm border-r border-border">Restless and Wild</td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400">2</td>
              </tr>
              <tr class="grid-cell">
                <td class="px-3 py-2"><input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500"></td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400 border-r border-border">4</td>
                <td class="px-3 py-2 text-sm border-r border-border">Let There Be Rock</td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400">1</td>
              </tr>
              <tr class="grid-cell">
                <td class="px-3 py-2"><input type="checkbox" class="rounded border-zinc-600 bg-page text-navy-500"></td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400 border-r border-border">5</td>
                <td class="px-3 py-2 text-sm border-r border-border">Big Ones</td>
                <td class="px-3 py-2 text-sm font-mono text-zinc-400">3</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="h-10 bg-surface border-t border-border flex items-center px-4 shrink-0">
          <button class="flex items-center gap-1.5 text-sm text-muted hover:text-zinc-100 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add row
          </button>
        </div>
      </main>
    </div>

    <footer class="h-7 bg-surface border-t border-border flex items-center px-4 text-xs shrink-0">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-emerald-400 font-medium">
          <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>
          Saved
        </span>
        <span class="text-muted">OPFS</span>
        <span class="text-muted">1.2 MB</span>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-3 text-muted">
        <span>347 rows</span>
        <span>FK: <span class="text-emerald-400 font-medium">ON</span></span>
        <span class="font-mono">SQLite 3.45.0</span>
      </div>
    </footer>
  </div>
</body>
</html>
