<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite Editor — Table Designer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 600: '#1e3a5f', 700: '#162d4d' },
            surface: '#ffffff',
            page: '#f9fafb',
            border: '#e5e7eb',
            muted: '#6b7280',
            amber: '#d4a853',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    * { font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11'; }
    .tree-item { transition: background 150ms ease-out; }
    .tree-item:hover { background: #f3f4f6; }
    .tree-item.selected { background: #e5e7eb; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-page font-sans text-gray-900 antialiased">
  <div class="h-screen flex flex-col">

    <!-- Top Toolbar -->
    <header class="h-12 bg-surface border-b border-border flex items-center px-4 gap-4 shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 bg-navy-600 rounded-sm"></div>
        <span class="font-semibold text-sm tracking-tight">SQLite Editor</span>
      </div>
      <div class="w-px h-6 bg-border"></div>
      <div class="flex items-center gap-1">
        <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded transition-colors">Open Database</button>
        <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded transition-colors">New Database</button>
      </div>
      <div class="flex-1"></div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-60 bg-surface border-r border-border flex flex-col shrink-0">
        <div class="p-3 border-b border-border">
          <div class="relative">
            <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" placeholder="Search tables..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-page border border-border rounded focus:outline-none focus:ring-2 focus:ring-navy-600">
          </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-2">
          <div class="mb-1">
            <div class="tree-item selected flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
              <svg class="w-4 h-4 text-amber" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 4.02 2 6.5V17.5C2 19.98 6.48 22 12 22C17.52 22 22 19.98 22 17.5V6.5C22 4.02 17.52 2 12 2Z"></path>
              </svg>
              <span class="text-sm font-medium truncate">chinook</span>
            </div>

            <div class="ml-4">
              <div class="tree-item flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
                <span class="text-xs font-medium text-muted uppercase tracking-wider">Tables</span>
                <span class="text-xs text-gray-400 ml-auto">11</span>
              </div>

              <div class="ml-4 space-y-0.5">
                <div class="tree-item selected flex items-center gap-2 px-2 py-1 rounded cursor-pointer">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                  <span class="text-sm truncate">albums</span>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </aside>

      <!-- Table Designer -->
      <main class="flex-1 flex flex-col overflow-hidden bg-page">
        <div class="h-12 bg-surface border-b border-border flex items-center px-4 gap-4 shrink-0">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <h1 class="font-semibold text-sm">Design Table</h1>
          </div>
          <div class="flex items-center gap-1 ml-4">
            <button class="px-3 py-1.5 text-sm text-muted hover:text-gray-700 transition-colors">Data</button>
            <button class="px-3 py-1.5 text-sm font-medium bg-page border border-border rounded-t border-b-0 -mb-px relative z-10">Design</button>
            <button class="px-3 py-1.5 text-sm text-muted hover:text-gray-700 transition-colors">SQL</button>
          </div>
          <div class="flex-1"></div>
          <div class="flex items-center gap-2">
            <button class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded transition-colors">
              Preview Changes
            </button>
            <button class="px-4 py-1.5 bg-navy-600 text-white text-sm font-medium rounded hover:bg-navy-700 transition-colors">
              Apply
            </button>
          </div>
        </div>

        <!-- Designer Form -->
        <div class="flex-1 overflow-auto p-6">
          <div class="max-w-4xl mx-auto">

            <!-- Table Name -->
            <div class="mb-6">
              <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Table Name</label>
              <input
                type="text"
                value="albums"
                class="w-64 px-3 py-2 text-sm border border-border rounded focus:outline-none focus:ring-2 focus:ring-navy-600 font-mono"
              >
            </div>

            <!-- Columns -->
            <div class="mb-6">
              <div class="flex items-center justify-between mb-3">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wider">Columns</label>
                <button class="text-sm text-navy-600 hover:text-navy-700 font-medium flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                  Add Column
                </button>
              </div>

              <div class="bg-surface border border-border rounded-lg overflow-hidden">
                <!-- Header -->
                <div class="grid grid-cols-12 gap-2 px-4 py-2 bg-gray-50 border-b border-border text-xs font-medium text-gray-500 uppercase tracking-wider">
                  <div class="col-span-1"></div>
                  <div class="col-span-3">Name</div>
                  <div class="col-span-2">Type</div>
                  <div class="col-span-1 text-center">PK</div>
                  <div class="col-span-1 text-center">NOT NULL</div>
                  <div class="col-span-1 text-center">UNIQUE</div>
                  <div class="col-span-2">Default</div>
                  <div class="col-span-1"></div>
                </div>

                <!-- Column Rows -->
                <div class="divide-y divide-border">
                  <!-- AlbumId -->
                  <div class="grid grid-cols-12 gap-2 px-4 py-3 items-center hover:bg-gray-50">
                    <div class="col-span-1 drag-handle text-gray-400">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
                      </svg>
                    </div>
                    <div class="col-span-3">
                      <input type="text" value="AlbumId" class="w-full px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <select class="w-full px-2 py-1 text-sm border border-border rounded bg-white focus:outline-none focus:ring-2 focus:ring-navy-600">
                        <option selected>INTEGER</option>
                        <option>TEXT</option>
                        <option>REAL</option>
                        <option>BLOB</option>
                        <option>NUMERIC</option>
                      </select>
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" checked class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" checked class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <input type="text" placeholder="NULL" class="w-full px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600 text-gray-400">
                    </div>
                    <div class="col-span-1 text-right">
                      <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- Title -->
                  <div class="grid grid-cols-12 gap-2 px-4 py-3 items-center hover:bg-gray-50">
                    <div class="col-span-1 drag-handle text-gray-400">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
                      </svg>
                    </div>
                    <div class="col-span-3">
                      <input type="text" value="Title" class="w-full px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <select class="w-full px-2 py-1 text-sm border border-border rounded bg-white focus:outline-none focus:ring-2 focus:ring-navy-600">
                        <option>INTEGER</option>
                        <option selected>TEXT</option>
                        <option>REAL</option>
                        <option>BLOB</option>
                        <option>NUMERIC</option>
                      </select>
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" checked class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <input type="text" placeholder="NULL" class="w-full px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600 text-gray-400">
                    </div>
                    <div class="col-span-1 text-right">
                      <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- ArtistId (FK) -->
                  <div class="grid grid-cols-12 gap-2 px-4 py-3 items-center hover:bg-gray-50 bg-blue-50">
                    <div class="col-span-1 drag-handle text-gray-400">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
                      </svg>
                    </div>
                    <div class="col-span-3 flex items-center gap-2">
                      <input type="text" value="ArtistId" class="flex-1 px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600">
                      <span class="text-xs text-blue-600 font-medium" title="Foreign Key to artists.ArtistId">FK</span>
                    </div>
                    <div class="col-span-2">
                      <select class="w-full px-2 py-1 text-sm border border-border rounded bg-white focus:outline-none focus:ring-2 focus:ring-navy-600">
                        <option selected>INTEGER</option>
                        <option>TEXT</option>
                        <option>REAL</option>
                        <option>BLOB</option>
                        <option>NUMERIC</option>
                      </select>
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" checked class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <input type="text" placeholder="NULL" class="w-full px-2 py-1 text-sm border border-border rounded font-mono focus:outline-none focus:ring-2 focus:ring-navy-600 text-gray-400">
                    </div>
                    <div class="col-span-1 text-right">
                      <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- New Column (being added) -->
                  <div class="grid grid-cols-12 gap-2 px-4 py-3 items-center bg-green-50 border-l-2 border-green-500">
                    <div class="col-span-1 drag-handle text-gray-400">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path>
                      </svg>
                    </div>
                    <div class="col-span-3">
                      <input type="text" value="ReleaseYear" placeholder="column_name" class="w-full px-2 py-1 text-sm border border-green-300 rounded font-mono focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
                    </div>
                    <div class="col-span-2">
                      <select class="w-full px-2 py-1 text-sm border border-green-300 rounded bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option selected>INTEGER</option>
                        <option>TEXT</option>
                        <option>REAL</option>
                        <option>BLOB</option>
                        <option>NUMERIC</option>
                      </select>
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-1 text-center">
                      <input type="checkbox" class="rounded border-gray-300 text-navy-600 focus:ring-navy-600">
                    </div>
                    <div class="col-span-2">
                      <input type="text" placeholder="NULL" class="w-full px-2 py-1 text-sm border border-green-300 rounded font-mono focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
                    </div>
                    <div class="col-span-1 text-right">
                      <button class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Hint -->
            <div class="text-xs text-muted">
              Drag rows to reorder columns (display only). Changes are not saved until you click Apply.
            </div>

          </div>
        </div>
      </main>
    </div>

    <footer class="h-7 bg-surface border-t border-border flex items-center px-4 text-xs shrink-0">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-amber-600 font-medium">
          <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
          Draft changes
        </span>
        <span class="text-muted">OPFS</span>
        <span class="text-muted">1.2 MB</span>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-3 text-muted">
        <span>FK: <span class="text-green-600 font-medium">ON</span></span>
        <span class="font-mono">SQLite 3.45.0</span>
      </div>
    </footer>
  </div>
</body>
</html>
